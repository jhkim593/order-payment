x-app-env: &app-env
  TZ: Asia/Seoul
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/logs
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-lgtm:4318/v1/metrics

services:
  # PostgreSQL for Order Service
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: root
      POSTGRES_PASSWORD: a1234567!
    ports:
      - "30034:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - order-payment-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d order"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Payment Service
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: root
      POSTGRES_PASSWORD: a1234567!
    ports:
      - "30035:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - order-payment-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for User Service
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: root
      POSTGRES_PASSWORD: a1234567!
    ports:
      - "30036:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - order-payment-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9092,INTERNAL://kafka:9093'
      KAFKA_LISTENERS: 'EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - order-payment-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    networks:
      - order-payment-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9093"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - order-payment-network

  order-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: order-db-exporter
    command: ["--collector.stat_statements", "--collector.stat_statements.include_query"]
    environment:
      DATA_SOURCE_NAME: postgresql://root:a1234567!@order-db:5432/order?sslmode=disable
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - order-payment-network

  payment-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: payment-db-exporter
    command: ["--collector.stat_statements", "--collector.stat_statements.include_query"]
    environment:
      DATA_SOURCE_NAME: postgresql://root:a1234567!@payment-db:5432/payment?sslmode=disable
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - order-payment-network

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4318:4318"   # OTLP HTTP receiver
      - "4317:4317"   # OTLP gRPC receiver
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/order-payment.yaml
      - ./monitoring/grafana/dashboards:/otel-lgtm/order-payment-dashboards
      - ./monitoring/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml
    networks:
      - order-payment-network

  payment-service:
    build:
      context: .
      args:
        MODULE: payment/payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - order-payment-network

  1vice:
    build:
      context: .
      args:
        MODULE: order
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order
      ENDPOINTS_PAYMENT_SERVICE: http://payment-service:8082
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_started
    networks:
      - order-payment-network

volumes:
  order-db-data:
  payment-db-data:
  user-db-data:

networks:
  order-payment-network:
    driver: bridge
